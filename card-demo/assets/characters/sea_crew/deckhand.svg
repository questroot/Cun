<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="576" height="240" viewBox="0 0 144 60">
<!-- Three plates, each 48 x 60 chart units. Top is 70 units above the deck. -->
<defs>
 <linearGradient id="wax" x2=".8" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#ffc86d"/><stop offset=".55" stop-color="#e59a49"/><stop offset="1" stop-color="#bc683e"/></linearGradient>
 <linearGradient id="cap" x2="0" y2="1"><stop stop-color="#72b8a2"/><stop offset="1" stop-color="#36786f"/></linearGradient>
 <g id="coil" fill="none" stroke-linecap="round"><path d="M-2 5q-4 7-2 10m3-11q6 6 4 10" stroke="#5c4939" stroke-width="2"/><g stroke="#e7bd79" stroke-width="1.4"><ellipse rx="5" ry="7"/><ellipse rx="3.2" ry="5.5"/><ellipse rx="1.5" ry="4"/></g></g>
 <g id="face" stroke="#323e3b" stroke-width="1.15" stroke-linejoin="round"><path fill="#eab68a" d="M16 12q2-8 12-7 8 2 7 12l2 4-3 1q-1 7-7 7l-1 4-9-4 1-6q-4-2-2-5z"/><path fill="#614737" stroke="none" d="M16 13l6 1-2 7-3 2-3-3zm5 11q6 3 12-1-2 7-8 5z"/><path fill="none" d="m27 16 4-.6m-2 2v1"/><path fill="#ffdcab" stroke="none" d="m34 19 1.6 2-2.5.3z"/></g>
 <g id="hat" stroke="#243e3e" stroke-width="1.3" stroke-linejoin="round"><path fill="url(#cap)" d="M12 13Q11 5 19 2q10-5 15 3l1 5 5 1q1 2-6 3l-17 2-5-1z"/><path fill="#315954" d="m12 11 21-3 3 3-23 4z"/><path fill="none" stroke="#a2d2b4" stroke-width=".85" d="m16 8 2-4m2 3 2-5m3 4 1-4"/><circle cx="29" cy="10.5" r="1.1" fill="#f8d48a" stroke="none"/></g>
 <g id="shell" stroke="#293f3b" stroke-width="1.45" stroke-linejoin="round"><path fill="url(#wax)" d="m16 26 9-3 6 3q4 2 5 7l-2 11 2 9q-12 5-27 0l3-13-1-8q0-4 5-6z"/><path fill="#26756d" d="m15 24 7 2 7-2 4 3-6 5-1 5-4-3-3-3-5-2z"/><path fill="#fbd68c" stroke="none" d="m13 34 4-3-2 13-3 6z"/><path fill="#88563c" d="m11 45 23-1v4l-24 1z"/><rect x="21" y="44.6" width="4.6" height="3.8" rx=".6" fill="#e9ba72" stroke-width=".8"/></g>
 <g id="sleeve" stroke="#2b403c" stroke-linejoin="round"><path fill="url(#wax)" stroke-width="1.35" d="M0 0q5-3 7 2l2 10-2 4-6-1-2-9z"/><path fill="#347b72" d="m1 12 8-.4.3 4-8 .8z"/><path fill="#584b3f" d="m2 16 6-.6 1 3-1 4-3 1-2-2z"/><path fill="none" stroke="#ffe0a4" d="m2 2 2 7"/></g>
</defs>
<!-- Frontal three-quarter, showing the map case and brass fastening. -->
<g><use xlink:href="#shell"/><use xlink:href="#face" transform="translate(-3 -1)"/><use xlink:href="#hat" transform="translate(-2 0)"/><path fill="#834e37" stroke="#4c4135" stroke-width="1" d="m13 28 3-1 18 18-3 2z"/><path d="m26 35 5-1-1 5-4 1z" fill="#ffe0a2" stroke="#74543c"/><use xlink:href="#sleeve" transform="translate(29 29) rotate(-8)"/><use xlink:href="#sleeve" transform="translate(10 29) rotate(12)"/><use xlink:href="#coil" transform="translate(10 47) scale(.78)"/><path d="m18 51 5 1m3-2 4 1" stroke="#ffe0a4" stroke-width="1"/></g>
<!-- Profile, with projecting brim, cheek, sailor's pack and trailing scarf. -->
<g transform="translate(48)"><path d="m11 26-6 2 2 5-6 5 10-2 6-9z" fill="#428a78" stroke="#293f3b"/><rect x="5" y="28" width="12" height="20" rx="4" fill="#427e72" stroke="#293f3b" stroke-width="1.5"/><path d="M7 33h7m-6 3h5" stroke="#a7c4a0"/><use xlink:href="#shell"/><use xlink:href="#face"/><use xlink:href="#hat"/><path d="m16 27 3 1 6 18-4 1z" fill="#8f593b" stroke="#58483a"/><use xlink:href="#coil" transform="translate(12 46) scale(.8)"/><use xlink:href="#sleeve" transform="translate(20 29) rotate(-13)"/><path d="m28 50 5-.5" stroke="#ffe2a3"/></g>
<!-- Rear plate: knitted cap, oilskin storm flap and rope slung over a canvas pack. -->
<g transform="translate(96)"><use xlink:href="#shell"/><path fill="#69503d" stroke="#34433d" d="M13 11q0-8 11-8 13 0 10 12l-3 10-7 3-8-3z"/><use xlink:href="#hat" transform="translate(1 0) scale(.94 1.05)"/><path fill="#72ad96" stroke="#2c4842" d="M13 22q9 5 19 0l1 4-6 4-12-2z"/><use xlink:href="#sleeve" transform="translate(9 29) rotate(9)"/><use xlink:href="#sleeve" transform="translate(30 29) rotate(-7)"/><path d="m15 29 4-1 4 13-4 4zm15-1 2 1-2 13-4-1z" fill="#79553e"/><rect x="14" y="31" width="17" height="19" rx="3" fill="#3e7970" stroke="#27433e" stroke-width="1.5"/><path d="M14 33q7-5 17 0l-1 5-7 2-8-3z" fill="#75a692" stroke="#29483f"/><path d="M22 37v6" stroke="#e9bc7a" stroke-width="2"/><use xlink:href="#coil" transform="translate(13 46) scale(.7)"/></g>
</svg>